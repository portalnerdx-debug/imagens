name: Fix CCC DOM regex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix CCC DOM regex')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only CCC DOM matching
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/robot/src/cardSimulation.ts')
          s = p.read_text(encoding='utf-8')

          replacements = {
            r"/^\\\\d{5,}$/": r"/^\\d{5,}$/",
            r"/T\\\\s*CREDITO/i": r"/T\\s*CREDITO/i",
            r"/data-cdpagamento=[\"'](\\\\d+)[\"']/gi": r"/data-cdpagamento=[\"'](\\d+)[\"']/gi",
            r"/(?:id|name)=[\"']valor_parc\\\\[\\\\][\"']/i": r"/(?:id|name)=[\"']valor_parc\\[\\][\"']/i",
          }
          for old, new in replacements.items():
            s = s.replace(old, new)

          # Keep all existing CCS code unchanged. Only CCC helpers/regexes are touched.
          p.write_text(s, encoding='utf-8')
          Path('VERSION').write_text('1.0.28-etapa8.47-ccc-dom-regex\n', encoding='utf-8')

      - name: Commit patched files and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/robot/src/cardSimulation.ts VERSION .github/workflows/fix-ccc-dom-regex.yml
          git commit -m "fix CCC DOM regex"
          git push