services:
  - type: web
    name: xvendas-robot
    runtime: docker
    plan: free
    dockerfilePath: ./apps/robot/Dockerfile
    dockerContext: ./apps/robot
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CLICK_BASE_URL
        value: https://plataformaclick.com.br
      - key: CLICK_HEADLESS
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: vendas-211b4
      - key: ALLOWED_ORIGIN
        value: https://vendas-211b4.web.app,https://vendas-211b4.firebaseapp.com
      - key: JPDJSANTOS
        sync: false
      - key: Dti@dti4
        sync: false
